appId: 'districtlifelauncher'
productName: 'DistrictLife Launcher'
# Pas d'espace dans le nom de fichier : electron-builder sanitise l'espace de
# ${productName} en "-" pour latest.yml, mais GitHub renomme l'espace en "." sur le
# fichier réellement uploadé → les deux noms ne correspondent plus et electron-updater
# télécharge un fichier inexistant en boucle. On fixe le nom sans espace à la source.
artifactName: 'DistrictLife-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'
icon: 'app/assets/images/district_life_icon_v1_4092x4092.png'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,server,patches}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'DistrictLife-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Daniel Scalzi'
  vendor: 'Daniel Scalzi'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


publish:
  provider: github
  owner: ImDarling-bit
  repo: HeliosLauncher
  releaseType: release

directories:
  buildResources: 'build'
  output: 'dist'